<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0F172A; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
.logo { width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, #7C3AED, #3B82F6); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; margin-bottom: 16px; }
.name { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.tagline { color: #94A3B8; font-size: 14px; margin-bottom: 32px; }
.links { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
.link { display: block; padding: 16px 24px; border-radius: 12px; background: #1E293B; color: white; text-decoration: none; font-size: 16px; font-weight: 600; text-align: center; transition: all 0.2s; border: 1px solid #334155; }
.link:hover { background: #7C3AED; border-color: #7C3AED; transform: translateY(-2px); }
.link.primary { background: linear-gradient(135deg, #7C3AED, #3B82F6); border: none; }
.link.primary:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(124,58,237,0.4); }
.stat { display: flex; gap: 24px; margin-bottom: 32px; }
.stat-item { text-align: center; }
.stat-num { font-size: 24px; font-weight: 700; color: #7C3AED; }
.stat-label { font-size: 12px; color: #94A3B8; }
.footer { margin-top: 40px; color: #475569; font-size: 12px; }
</style>
</head>
<body>
<div class="logo">H</div>
<div class="name">HirePilot</div>
<div class="tagline">Your AI Career Co-Pilot</div>
<div class="stat">
<div class="stat-item"><div class="stat-num">12,850+</div><div class="stat-label">Resumes Created</div></div>
<div class="stat-item"><div class="stat-num">8,928+</div><div class="stat-label">Interviews Practiced</div></div>
<div class="stat-item"><div class="stat-num">5,241+</div><div class="stat-label">Students Placed</div></div>
</div>
<div class="links">
<a href="https://hirepilot.nx.kg/" class="link primary">Get Started Free</a>
<a href="https://hirepilot.nx.kg/resume-intelligence" class="link">AI Resume Analysis</a>
<a href="https://hirepilot.nx.kg/interview-coach" class="link">Interview Coaching</a>
<a href="https://hirepilot.nx.kg/portfolio" class="link">Portfolio Builder</a>
<a href="https://hirepilot.nx.kg/career-coach" class="link">Career Path Planner</a>
<a href="https://hirepilot.nx.kg/pricing" class="link">Pricing</a>
</div>
<div class="footer">Built for Indian students & freshers</div>
</body>
</html>

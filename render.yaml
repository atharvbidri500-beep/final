services:
  - type: web
    name: hire-pilot
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @workspace/api-server build && cd artifacts/career-boost && PORT=5173 BASE_PATH=/ pnpm run build
    startCommand: node ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_DIST
        value: ./artifacts/career-boost/dist/public
      - key: POLLINATIONS_URL
        value: https://text.pollinations.ai/openai
